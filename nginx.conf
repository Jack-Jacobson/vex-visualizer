server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/csv application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /assets/ {
        expires 30d;
    }

    location ~* \.(js|css)$ {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}